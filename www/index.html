<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zapette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1622; --surface:#132130; --surface2:#1b2d3f; --line:#26384b; --fg:#eaf2f8; --muted:#8ba0b3;
    --accent:#36cfd0; --accent-soft:#123038; --on:#34c759; --off:#ff4d4f; --warn:#ffcf3a;
    --disp:"Barlow Semi Condensed",Impact,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);
    padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 20px);max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mk{width:30px;height:30px;flex:none}
  h1{font-family:var(--disp);font-size:1.7rem;font-weight:800;margin:0;letter-spacing:.5px}
  h1 b{color:var(--accent);font-weight:800}
  .status{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:1px}
  .status.ok{color:var(--accent)}
  .gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);
    display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
  .gear svg{width:21px;height:21px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .hint{font-size:.82rem;color:var(--muted);line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{border:0;border-radius:16px;padding:20px 14px;font-family:var(--disp);font-weight:700;font-size:1.15rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#fff;
    background:var(--surface2);border:1px solid var(--line);min-height:92px;text-align:center;line-height:1.1}
  .btn svg{width:30px;height:30px}
  .btn.app{background:linear-gradient(140deg,#1f6feb,#36cfd0);color:#fff;border:0}
  .btn.app.alt{background:linear-gradient(140deg,#7a3ff2,#b05cff)}
  .btn.on{background:var(--on);color:#06310f;border:0}
  .btn.off{background:var(--off);color:#3a0404;border:0}
  .btn.art{background:linear-gradient(140deg,#d98a2b,#f0c23a);color:#2a1800;border:0}
  .btn.ghost{background:var(--surface2)}
  .btn:active{transform:scale(.97)}
  .vol{display:flex;gap:12px}
  .vol .btn{flex:1}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:260px;margin:4px auto 0}
  .nav button{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:13px;padding:14px 0;font-size:1.1rem;font-weight:700;cursor:pointer}
  .nav button:active{background:var(--accent-soft)}
  .nav .ok{background:var(--accent);color:#04242a;border:0;font-family:var(--disp)}
  .lbl{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 9px}
  .field{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px}
  .field label{display:block;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .field input{border:0;background:transparent;color:var(--fg);font-family:var(--body);font-size:1rem;width:100%;min-width:0}
  .field input:focus{outline:none}
  .wbtn{width:100%;border:0;border-radius:13px;padding:14px;font-family:var(--disp);font-weight:700;font-size:1.02rem;background:var(--accent);color:#04242a;cursor:pointer;margin-bottom:8px}
  .wbtn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
  .applist{max-height:40vh;overflow:auto;margin-top:6px}
  .approw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .approw .nm{font-weight:600;font-size:.95rem}
  .approw .id{font-size:.72rem;color:var(--muted)}
  .pick{display:flex;gap:6px}
  .pick button{border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:999px;padding:5px 10px;font-size:.74rem;font-weight:700;cursor:pointer}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 18px);z-index:50;background:var(--fg);color:var(--bg);
    padding:12px 15px;border-radius:12px;font-size:.9rem;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .row2{display:flex;gap:12px}.row2 .btn{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var state={ip:"",mac:"",token:"",tvName:"",view:"remote",
    b1:{label:"TV Streamy",appId:"TvStrmy001.TVStreamy"},
    b2:{label:"TV by Free",appId:""},
    apps:[],picking:null,art:false};
  try{var s=JSON.parse(localStorage.getItem("zapette")||"{}");Object.assign(state,s);state.apps=[];state.picking=null;}catch(e){}
  function save(){try{localStorage.setItem("zapette",JSON.stringify({ip:state.ip,mac:state.mac,token:state.token,tvName:state.tvName,b1:state.b1,b2:state.b2}));}catch(e){}}

  // --- pont natif ---
  function rc(){return (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SamsungRemote)||null;}
  function native(){return !!rc();}
  var toastT;
  function toast(m){var e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e);}e.textContent=m;requestAnimationFrame(function(){e.classList.add("show");});clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("show");},2600);}
  function needApp(){toast("Fonctionne depuis l'APK installée, sur le même Wi-Fi que la TV.");}

  // --- mises à jour (APK sur GitHub) ---
  var NATIVE_APP=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
  var APP_VERSION="@@BUILD@@", REPO="Nagromc86/Zapette";
  var APK_URL="https://github.com/"+REPO+"/releases/download/latest/Zapette.apk";
  var REL_API="https://api.github.com/repos/"+REPO+"/releases/tags/latest";
  var appUpd={checking:false,avail:false};
  function devBuild(){return APP_VERSION.indexOf("@@")>=0;}
  function openExternal(u){var a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);}
  function checkUpdate(manual){
    if(appUpd.checking)return;appUpd.checking=true;if(state.view==="settings")render();
    fetch(REL_API,{headers:{Accept:"application/vnd.github+json"}}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      appUpd.checking=false;var rv=null;if(j){var m=(j.body||"").match(/build:([0-9a-f]+)/i);rv=m?m[1]:null;}
      appUpd.avail=!!(rv&&!devBuild()&&rv!==APP_VERSION);
      if(manual)toast(appUpd.avail?"Nouvelle version disponible":(devBuild()?"Build de développement":"L'appli est à jour"));
      if(state.view==="settings")render();
    }).catch(function(){appUpd.checking=false;if(manual)toast("Vérification impossible");});
  }
  function getApk(){openExternal(APK_URL);toast("Téléchargement…");}

  function connect(cb){
    if(!state.ip){toast("Renseigne l'adresse IP de la TV.");return;}
    if(!native()){needApp();return;}
    toast("Connexion à la TV…");
    rc().connect({ip:state.ip,token:state.token||""}).then(function(r){
      if(r&&r.token)state.token=r.token;
      if(r&&r.name)state.tvName=r.name;
      save();render();toast("Connectée"+(state.tvName?" · "+state.tvName:""));
      if(cb)cb();
    }).catch(function(e){toast("Échec : autorise la Zapette sur l'écran de la TV, puis réessaie.");});
  }
  function key(k){ if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;} rc().key({ip:state.ip,token:state.token||"",key:k}).catch(function(){toast("Non connectée — ouvre les réglages.");}); }
  function launch(appId){
    if(!appId){toast("Associe d'abord une application dans les réglages.");return;}
    if(!native()){needApp();return;}
    if(!state.ip){toast("Configure la TV d'abord.");return;}
    rc().launch({ip:state.ip,token:state.token||"",appId:appId}).then(function(){toast("Lancement…");}).catch(function(){toast("Échec du lancement.");});
  }
  function wol(){ if(!native()){needApp();return;} if(!state.mac){toast("Renseigne l'adresse MAC de la TV (réglages) pour l'allumage.");return;} rc().wol({mac:state.mac}).then(function(){toast("Allumage…");}).catch(function(){toast("Allumage impossible.");}); }
  function artMode(){ if(!native()){needApp();return;} state.art=!state.art; rc().artMode({ip:state.ip,token:state.token||"",on:state.art}).then(function(){toast(state.art?"Art Mode activé":"Art Mode désactivé");}).catch(function(){toast("Art Mode indisponible sur ce modèle.");}); }
  function detect(){ if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;} toast("Recherche des applis…"); rc().listApps({ip:state.ip,token:state.token||""}).then(function(r){state.apps=(r&&r.apps)||[];render();if(!state.apps.length)toast("Aucune appli détectée (selon le modèle).");}).catch(function(){toast("Détection indisponible — tu peux saisir l'ID à la main.");}); }

  var ICON={
    power:'<path d="M12 3v9" /><path d="M6.5 7a8 8 0 1 0 11 0"/>',
    play:'<path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/>',
    art:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 5"/>',
    volup:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8M19.5 5.5a9 9 0 0 1 0 13"/>',
    voldn:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/>'
  };
  function ic(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>';}

  function remoteView(){
    var h='';
    if(!state.ip){
      h+='<div class="card"><div class="lbl">Première utilisation</div>'+
        '<div class="hint">Connecte la Zapette à ta TV Samsung (même Wi-Fi). Ouvre les réglages ⚙️ pour saisir son adresse IP, puis appaire — la TV affichera une demande d\'autorisation.</div>'+
        '<button class="wbtn" data-view="settings" style="margin-top:12px">Configurer ma TV</button></div>';
      return h;
    }
    h+='<div class="row2" style="margin-bottom:12px">'+
      '<button class="btn on" data-wol>'+ic("power")+'Allumer</button>'+
      '<button class="btn off" data-key="KEY_POWER">'+ic("power")+'Éteindre</button></div>';
    h+='<div class="grid">'+
      '<button class="btn app" data-launch="b1">'+ic("play")+esc(state.b1.label)+'</button>'+
      '<button class="btn app alt" data-launch="b2">'+ic("play")+esc(state.b2.label||"TV by Free")+'</button>'+
      '<button class="btn art" data-art>'+ic("art")+'Art Mode</button>'+
      '<button class="btn ghost" data-key="KEY_HOME" style="font-size:1rem">Accueil</button>'+
      '</div>';
    h+='<div class="vol" style="margin-top:12px">'+
      '<button class="btn ghost" data-key="KEY_VOLDOWN">'+ic("voldn")+'Vol −</button>'+
      '<button class="btn ghost" data-key="KEY_MUTE" style="font-size:1rem">Muet</button>'+
      '<button class="btn ghost" data-key="KEY_VOLUP">'+ic("volup")+'Vol +</button></div>';
    h+='<div class="card" style="margin-top:14px"><div class="lbl">Navigation</div>'+
      '<div class="nav">'+
        '<button></button><button data-key="KEY_UP">▲</button><button></button>'+
        '<button data-key="KEY_LEFT">◀</button><button class="ok" data-key="KEY_ENTER">OK</button><button data-key="KEY_RIGHT">▶</button>'+
        '<button data-key="KEY_RETURN">Retour</button><button data-key="KEY_DOWN">▼</button><button data-key="KEY_CHUP" style="font-size:.8rem">Ch+</button>'+
      '</div></div>';
    return h;
  }

  function settingsView(){
    var h='<div class="card"><div class="lbl">Ma TV Samsung</div>'+
      '<div class="field"><label>Adresse IP de la TV</label><input id="f-ip" type="text" inputmode="decimal" placeholder="ex. 192.168.1.30" value="'+esc(state.ip)+'"></div>'+
      '<div class="field"><label>Adresse MAC (pour l\'allumage)</label><input id="f-mac" type="text" placeholder="ex. A1:B2:C3:D4:E5:F6" value="'+esc(state.mac)+'"></div>'+
      '<button class="wbtn" data-connect>'+(state.token?"Reconnecter / ré-appairer":"Appairer la TV")+'</button>'+
      '<div class="hint">'+(state.tvName?("Connectée à <b>"+esc(state.tvName)+"</b>. "):"")+'Active « Mise sous tension à distance » (ou Wake-on-LAN) dans les réglages réseau de la TV pour l\'allumage.</div></div>';
    // raccourcis d'apps
    h+='<div class="card"><div class="lbl">Boutons d\'applications</div>';
    [["b1",state.b1],["b2",state.b2]].forEach(function(p){
      var k=p[0],b=p[1];
      h+='<div class="field"><label>Bouton « '+esc(b.label)+' » · ID d\'application</label><input id="f-'+k+'" type="text" placeholder="ex. '+(k==="b1"?"TvStrmy001.TVStreamy":"3201xxxxxxxxx")+'" value="'+esc(b.appId)+'"></div>';
    });
    h+='<button class="wbtn sec" data-detect>Détecter les applis installées</button>';
    if(state.apps.length){
      h+='<div class="hint">Touche « → TV Streamy » ou « → TV by Free » pour associer une appli détectée au bouton.</div><div class="applist">';
      state.apps.forEach(function(a){
        h+='<div class="approw"><div style="min-width:0"><div class="nm">'+esc(a.name||a.appId)+'</div><div class="id">'+esc(a.appId)+'</div></div>'+
          '<div class="pick"><button data-assign="b1" data-appid="'+esc(a.appId)+'" data-applabel="'+esc(a.name||"")+'">→ 1</button><button data-assign="b2" data-appid="'+esc(a.appId)+'" data-applabel="'+esc(a.name||"")+'">→ 2</button></div></div>';
      });
      h+='</div>';
    }
    h+='</div>';
    // application / mise à jour
    h+='<div class="card"><div class="lbl">Application</div>'+
      '<div class="hint">Version : '+(devBuild()?"préversion (dev)":esc(APP_VERSION))+(appUpd.avail?" · <b>mise à jour disponible</b>":"")+'</div>'+
      '<button class="wbtn sec" data-checkupd'+(appUpd.checking?" disabled":"")+' style="margin-top:10px">'+(appUpd.checking?"Recherche…":"Rechercher une mise à jour")+'</button>'+
      (appUpd.avail?'<button class="wbtn" data-getapk>Télécharger la mise à jour</button>':'')+'</div>';
    h+='<button class="wbtn sec" data-view="remote">← Retour à la télécommande</button>';
    return h;
  }

  function render(){
    var h='<header><div class="brand">'+
      '<svg class="mk" viewBox="0 0 32 32" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="14" height="26" rx="5"/><circle cx="16" cy="10" r="2.3" fill="var(--accent)" stroke="none"/><path d="M13 18h6M16 22v3"/></svg>'+
      '<div style="min-width:0"><h1>Za<b>pette</b></h1><div class="status'+(state.token?" ok":"")+'">'+(state.ip?(state.token?("● "+esc(state.tvName||state.ip)):("○ "+esc(state.ip)+" · non appairée")):"Non configurée")+'</div></div></div>'+
      '<button class="gear" data-view="'+(state.view==="settings"?"remote":"settings")+'" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.2A1.6 1.6 0 0 0 7 19.3a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 2.7 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.2A1.6 1.6 0 0 0 17 2.7a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg></button></header>';
    h+=(state.view==="settings"?settingsView():remoteView());
    document.getElementById("app").innerHTML=h;
  }

  document.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-view],[data-key],[data-launch],[data-wol],[data-art],[data-connect],[data-detect],[data-assign],[data-checkupd],[data-getapk]");
    if(!t)return;var d=t.dataset;
    if(d.view){ if(state.view==="settings")syncFields(); state.view=d.view;render();window.scrollTo(0,0);return;}
    if(d.key){key(d.key);return;}
    if(d.launch){launch(state[d.launch].appId);return;}
    if(t.hasAttribute("data-wol")){wol();return;}
    if(t.hasAttribute("data-art")){artMode();return;}
    if(t.hasAttribute("data-connect")){syncFields();connect();return;}
    if(t.hasAttribute("data-detect")){syncFields();detect();return;}
    if(d.assign){var b=state[d.assign];b.appId=d.appid;if(d.applabel)b.label=d.applabel;save();toast("Associé au bouton "+(d.assign==="b1"?"1":"2"));render();return;}
    if(t.hasAttribute("data-checkupd")){checkUpdate(true);return;}
    if(t.hasAttribute("data-getapk")){getApk();return;}
  });
  function syncFields(){
    var ip=document.getElementById("f-ip"),mac=document.getElementById("f-mac"),b1=document.getElementById("f-b1"),b2=document.getElementById("f-b2");
    if(ip)state.ip=ip.value.trim();
    if(mac)state.mac=mac.value.trim();
    if(b1)state.b1.appId=b1.value.trim();
    if(b2)state.b2.appId=b2.value.trim();
    save();
  }
  render();
  if(NATIVE_APP)setTimeout(function(){checkUpdate(false);},4000);
})();
</script>
</body>
</html>
