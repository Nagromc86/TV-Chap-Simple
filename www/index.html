<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Chap Simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1622; --surface:#132130; --surface2:#1b2d3f; --line:#26384b; --fg:#eaf2f8; --muted:#8ba0b3;
    --accent:#36cfd0; --accent-soft:#123038; --on:#34c759; --off:#ff4d4f; --warn:#ffcf3a;
    --disp:"Barlow Semi Condensed",Impact,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);
    padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 20px);max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mk{width:30px;height:30px;flex:none}
  h1{font-family:var(--disp);font-size:1.7rem;font-weight:800;margin:0;letter-spacing:.5px}
  h1 b{color:var(--accent);font-weight:800}
  .status{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:1px}
  .status.ok{color:var(--accent)}
  .gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);
    display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
  .gear svg{width:21px;height:21px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .hint{font-size:.82rem;color:var(--muted);line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{border:0;border-radius:16px;padding:20px 14px;font-family:var(--disp);font-weight:700;font-size:1.15rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#fff;
    background:var(--surface2);border:1px solid var(--line);min-height:92px;text-align:center;line-height:1.1}
  .btn svg{width:30px;height:30px}
  .btn.app{background:linear-gradient(140deg,#1f6feb,#36cfd0);color:#fff;border:0}
  .btn.app.alt{background:linear-gradient(140deg,#7a3ff2,#b05cff)}
  .btn.on{background:var(--on);color:#06310f;border:0}
  .btn.off{background:var(--off);color:#3a0404;border:0}
  .btn.art{background:linear-gradient(140deg,#d98a2b,#f0c23a);color:#2a1800;border:0}
  .btn.ghost{background:var(--surface2)}
  .btn:active{transform:scale(.97)}
  .vol{display:flex;gap:12px}
  .vol .btn{flex:1}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:260px;margin:4px auto 0}
  .nav button{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:13px;padding:14px 0;font-size:1.1rem;font-weight:700;cursor:pointer}
  .nav button:active{background:var(--accent-soft)}
  .nav .ok{background:var(--accent);color:#04242a;border:0;font-family:var(--disp)}
  .lbl{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 9px}
  .field{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px}
  .field label{display:block;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .field input{border:0;background:transparent;color:var(--fg);font-family:var(--body);font-size:1rem;width:100%;min-width:0}
  .field input:focus{outline:none}
  .wbtn{width:100%;border:0;border-radius:13px;padding:14px;font-family:var(--disp);font-weight:700;font-size:1.02rem;background:var(--accent);color:#04242a;cursor:pointer;margin-bottom:8px}
  .wbtn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
  .applist{max-height:40vh;overflow:auto;margin-top:6px}
  .approw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .approw .nm{font-weight:600;font-size:.95rem}
  .approw .id{font-size:.72rem;color:var(--muted)}
  .pick{display:flex;gap:6px}
  .pick button{border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:999px;padding:5px 10px;font-size:.74rem;font-weight:700;cursor:pointer}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 18px);z-index:50;background:var(--fg);color:var(--bg);
    padding:12px 15px;border-radius:12px;font-size:.9rem;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .row2{display:flex;gap:12px}.row2 .btn{flex:1}
  /* --- télécommande physique --- */
  .remote{background:linear-gradient(180deg,#10212f,#0a141e);border:1px solid var(--line);border-radius:30px;
    padding:20px 18px 24px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 16px 32px rgba(0,0,0,.42)}
  .rtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .rbtn{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--fg);
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
    font-family:var(--body);font-size:.56rem;font-weight:700;letter-spacing:.02em}
  .rbtn svg{width:23px;height:23px}
  .rbtn span{opacity:.82;text-transform:uppercase}
  .rbtn:active{transform:scale(.94)}
  .recbar{background:#3a1620;border:1px solid #ff5a5f;border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}.recbar b{color:#ff8a8f}.recbar div{display:flex;gap:8px}.recbar .wbtn{margin:0;padding:10px}
  .rbtn.on{background:var(--on);color:#06310f;border:0}
  .rbtn.pw{background:var(--off);color:#fff;border:0}
  .dpad{position:relative;width:232px;height:232px;margin:0 auto 6px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#21364d 0,#182a3d 56%,#0f1c2a 100%);
    border:1px solid var(--line);box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
  .dpad .ok{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:94px;height:94px;border-radius:50%;
    border:0;background:radial-gradient(circle at 50% 36%,#45dcdd,#1a9cad);color:#032227;
    font-family:var(--disp);font-weight:800;font-size:1.3rem;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.42)}
  .dpad .ok:active{transform:translate(-50%,-50%) scale(.95)}
  .dpad .dir{position:absolute;border:0;background:transparent;color:var(--fg);cursor:pointer;
    width:66px;height:66px;display:flex;align-items:center;justify-content:center;padding:0}
  .dpad .dir svg{width:27px;height:27px;opacity:.9}
  .dpad .dir:active svg{color:var(--accent)}
  .dpad .u{top:4px;left:50%;transform:translateX(-50%);align-items:flex-start}
  .dpad .d{bottom:4px;left:50%;transform:translateX(-50%);align-items:flex-end}
  .dpad .l{left:4px;top:50%;transform:translateY(-50%);justify-content:flex-start}
  .dpad .r{right:4px;top:50%;transform:translateY(-50%);justify-content:flex-end}
  .rrow{display:flex;gap:12px;margin-top:10px}
  .rrow .rk{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:14px;
    padding:13px 0;font-family:var(--body);font-weight:700;font-size:.9rem;
    display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
  .rrow .rk svg{width:20px;height:20px}
  .rrow .rk:active{background:var(--accent-soft)}
  .apps{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
  .appbtn{border:0;border-radius:16px;padding:18px 12px;font-family:var(--disp);font-weight:700;font-size:1.1rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#fff;
    min-height:84px;text-align:center;line-height:1.1;background:linear-gradient(140deg,#1f6feb,#36cfd0)}
  .appbtn svg{width:28px;height:28px}
  .appbtn.free{background:#000;color:#fff;min-height:96px;padding:10px 12px;flex-direction:row;gap:12px;border:1px solid var(--line)}
  .appbtn.free .applogo{max-height:76px;max-width:90%;object-fit:contain}
  .appbtn.free:not(.nologo) svg,.appbtn.free:not(.nologo) .aname{display:none}
  .appbtn.free.nologo{background:linear-gradient(140deg,#7a3ff2,#b05cff);color:#fff;border:0}
  .cfgta{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--fg);font-family:ui-monospace,monospace;font-size:.78rem;padding:10px;margin:8px 0;resize:vertical;box-sizing:border-box}
  .appbtn.alt{background:linear-gradient(140deg,#7a3ff2,#b05cff)}
  .appbtn:active{transform:scale(.97)}
  .pw-wol{width:100%;border:0;border-radius:14px;padding:14px;font-family:var(--disp);font-weight:700;font-size:1rem;
    background:var(--on);color:#06310f;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .pw-wol svg{width:22px;height:22px}
  .pw-wol:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
  function unent(s){return String(s==null?"":s).replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,"&");}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var state={ip:"",mac:"",token:"",tvName:"",view:"remote",
    b2:{label:"TV by Free",appId:""},macro:[],rec:null,
    apps:[],picking:null,art:false};
  try{var s=JSON.parse(localStorage.getItem("zapette")||"{}");Object.assign(state,s);state.apps=[];state.picking=null;state.rec=null;if(!Array.isArray(state.macro))state.macro=[];delete state.b1;state.b2=state.b2||{};state.b2.label="TV by Free";}catch(e){}
  function save(){try{localStorage.setItem("zapette",JSON.stringify({ip:state.ip,mac:state.mac,token:state.token,tvName:state.tvName,b2:state.b2,macro:state.macro}));}catch(e){}}

  // --- pont natif ---
  function rc(){return (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SamsungRemote)||null;}
  function native(){return !!rc();}
  var toastT;
  function toast(m){var e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e);}e.textContent=m;requestAnimationFrame(function(){e.classList.add("show");});clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("show");},2600);}
  function needApp(){toast("Fonctionne depuis l'APK installée, sur le même Wi-Fi que la TV.");}

  // --- mises à jour (APK sur GitHub) ---
  var NATIVE_APP=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
  var APP_VERSION="@@BUILD@@", REPO="Nagromc86/TV-Chap-Simple";
  var APK_URL="https://github.com/"+REPO+"/releases/download/latest/TV-Chap-Simple.apk";
  var REL_API="https://api.github.com/repos/"+REPO+"/releases/tags/latest";
  var appUpd={checking:false,avail:false};
  function devBuild(){return APP_VERSION.indexOf("@@")>=0;}
  function openExternal(u){var a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);}
  function checkUpdate(manual){
    if(appUpd.checking)return;appUpd.checking=true;if(state.view==="settings")render();
    fetch(REL_API,{headers:{Accept:"application/vnd.github+json"}}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      appUpd.checking=false;var rv=null;if(j){var m=(j.body||"").match(/build:([0-9a-f]+)/i);rv=m?m[1]:null;}
      appUpd.avail=!!(rv&&!devBuild()&&rv!==APP_VERSION);
      if(manual)toast(appUpd.avail?"Nouvelle version disponible":(devBuild()?"Build de développement":"L'appli est à jour"));
      if(state.view==="settings")render();
    }).catch(function(){appUpd.checking=false;if(manual)toast("Vérification impossible");});
  }
  function getApk(){openExternal(APK_URL);toast("Téléchargement…");}

  function connect(cb){
    if(!state.ip){toast("Renseigne l'adresse IP de la TV.");return;}
    if(!native()){needApp();return;}
    toast("Connexion à la TV…");
    rc().connect({ip:state.ip,token:state.token||""}).then(function(r){
      if(r&&r.token)state.token=r.token;
      if(r&&r.name)state.tvName=r.name;
      save();render();toast("Connectée"+(state.tvName?" · "+state.tvName:""));
      if(cb)cb();
    }).catch(function(e){toast("Échec : autorise la TV Chap Simple sur l'écran de la TV, puis réessaie.");});
  }
  var MK={KEY_UP:1,KEY_DOWN:1,KEY_LEFT:1,KEY_RIGHT:1,KEY_ENTER:1,KEY_RETURN:1,KEY_HOME:1};
  function key(k){ if(state.rec&&MK[k]){var n=Date.now();state.rec.steps.push({k:k,d:Math.max(500,Math.min(2500,n-state.rec.t))});state.rec.t=n;var c=document.getElementById("rec-n");if(c)c.textContent=state.rec.steps.length;} if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;} rc().key({ip:state.ip,token:state.token||"",key:k}).catch(function(){toast("Non connectée — ouvre les réglages.");}); }
  var playing=false;
  function playMacro(){
    if(playing)return; if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;}
    playing=true;toast("Lancement de TV by Free…");var i=0,L=state.macro;
    (function next(){ if(i>=L.length){playing=false;return;} var st=L[i++]; setTimeout(function(){ rc().key({ip:state.ip,token:state.token||"",key:st.k}).catch(function(){}); next(); }, st.d); })();
  }
  function startRec(){
    if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;}
    state.rec={steps:[],t:Date.now()};state.view="remote";render();window.scrollTo(0,0);
    toast("Enregistrement : retour à l'accueil de la TV…");
    state.rec.steps.push({k:"KEY_HOME",d:600});state.rec.t=Date.now()+1500;
    rc().key({ip:state.ip,token:state.token||"",key:"KEY_HOME"}).catch(function(){toast("Non connectée — ouvre les réglages.");});
    var c=document.getElementById("rec-n");if(c)c.textContent=state.rec.steps.length;
  }
  function stopRec(save_){
    if(!state.rec)return;
    if(save_){var st=state.rec.steps.slice();
      /* le dernier OK lance l'appli : on garde tout, sans doublon de départ */
      if(st.length<2){toast("Parcours trop court : navigue jusqu'à TV by Free puis valide avec OK.");return;}
      st[0].d=600;state.macro=st;save();toast("Parcours enregistré ("+st.length+" étapes).");}
    else toast("Enregistrement annulé.");
    state.rec=null;render();
  }
  function launch(appId){
    if(!appId&&state.macro.length){playMacro();return;}
    if(!appId){toast("Associe d'abord une application (ou enregistre un parcours) dans les réglages.");return;}
    if(!native()){needApp();return;}
    if(!state.ip){toast("Configure la TV d'abord.");return;}
    rc().launch({ip:state.ip,token:state.token||"",appId:appId}).then(function(){toast("Lancement…");}).catch(function(){toast("Échec du lancement.");});
  }
  function wol(){ if(!native()){needApp();return;} if(!state.mac){toast("Renseigne l'adresse MAC de la TV (réglages) pour l'allumage.");return;} rc().wol({mac:state.mac}).then(function(){toast("Allumage…");}).catch(function(){toast("Allumage impossible.");}); }
  function powerOff(){ if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;} toast("Extinction de la TV…"); try{navigator.vibrate&&navigator.vibrate(40);}catch(e){} rc().keyHold({ip:state.ip,token:state.token||"",key:"KEY_POWER",ms:3000}).catch(function(){toast("Extinction impossible.");}); }
  document.addEventListener("input",function(ev){var i=ev.target;if(!i||i.id!=="f-appq")return;state.appq=i.value;var q=norm(i.value);[].forEach.call(document.querySelectorAll(".approw"),function(r){r.style.display=!q||norm(r.textContent).indexOf(q)>=0?"":"none";});});
  var hold={t:null,done:false};
  document.addEventListener("pointerdown",function(ev){var b=ev.target.closest&&ev.target.closest("[data-art]");if(!b)return;hold.done=false;clearTimeout(hold.t);hold.t=setTimeout(function(){hold.done=true;powerOff();},700);});
  ["pointerup","pointercancel","pointerleave"].forEach(function(n){document.addEventListener(n,function(ev){if(hold.t&&ev.target.closest&&ev.target.closest("[data-art]")){clearTimeout(hold.t);hold.t=null;}},true);});
  document.addEventListener("contextmenu",function(ev){if(ev.target.closest&&ev.target.closest("[data-art]"))ev.preventDefault();});
  function artMode(){ if(!native()){needApp();return;} state.art=!state.art; rc().artMode({ip:state.ip,token:state.token||"",on:state.art}).then(function(){toast(state.art?"Art Mode activé":"Art Mode désactivé");}).catch(function(){toast("Art Mode indisponible sur ce modèle.");}); }
  function detect(){ if(!native()){needApp();return;} if(!state.ip){toast("Configure la TV d'abord.");return;} toast("Recherche des applis…"); rc().listApps({ip:state.ip,token:state.token||""}).then(function(r){state.apps=(r&&r.apps)||[];state.appq="";state.detectStatus=(r&&r.status)||"";render();if(!state.apps.length)toast("La TV ne donne pas sa liste d'applis ("+(state.detectStatus||"?")+"). Saisis l\x27ID à la main.");}).catch(function(){toast("Détection indisponible — tu peux saisir l'ID à la main.");}); }

  var ICON={
    power:'<path d="M12 3v9" /><path d="M6.5 7a8 8 0 1 0 11 0"/>',
    play:'<path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/>',
    art:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 5"/>',
    source:'<path d="M7 7h9l-3-3M17 17H8l3 3"/><path d="M7 7l-3 3 3 3M17 17l3-3-3-3" opacity=".0"/>',
    back:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12H8"/>',
    home:'<path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/>',
    mute:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
    volup:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8M19.5 5.5a9 9 0 0 1 0 13"/>',
    voldn:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/>',
    up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
    left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>'
  };
  function ic(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>';}

  function remoteView(){
    var h='';
    if(state.rec)h+='<div class="recbar"><b>● Enregistrement</b><span><span id="rec-n">'+state.rec.steps.length+'</span> étape(s) — navigue sur ta TV jusqu\'à TV by Free, puis valide avec OK.</span><div><button class="wbtn" data-recok>Terminer</button><button class="wbtn sec" data-reccancel>Annuler</button></div></div>';
    if(!state.ip){
      h+='<div class="card"><div class="lbl">Première utilisation</div>'+
        '<div class="hint">Connecte la TV Chap Simple à ta TV Samsung (même Wi-Fi). Ouvre les réglages ⚙️ pour saisir son adresse IP, puis appaire — la TV affichera une demande d\'autorisation.</div>'+
        '<button class="wbtn" data-view="settings" style="margin-top:12px">Configurer ma TV</button></div>';
      return h;
    }
    h+='<div class="remote">'+
      '<div class="rtop">'+
        '<button class="rbtn on" data-wol>'+ic("power")+'<span>Allumer</span></button>'+
        '<button class="rbtn" data-key="KEY_SOURCE">'+ic("source")+'<span>Source</span></button>'+
        '<button class="rbtn pw" data-art aria-label="Éteindre : appui court = Art Mode, appui long = extinction">'+ic("power")+'<span>Éteindre</span></button>'+
      '</div>'+
      '<div class="dpad">'+
        '<button class="dir u" data-key="KEY_UP" aria-label="Haut">'+ic("up")+'</button>'+
        '<button class="dir l" data-key="KEY_LEFT" aria-label="Gauche">'+ic("left")+'</button>'+
        '<button class="ok" data-key="KEY_ENTER">OK</button>'+
        '<button class="dir r" data-key="KEY_RIGHT" aria-label="Droite">'+ic("right")+'</button>'+
        '<button class="dir d" data-key="KEY_DOWN" aria-label="Bas">'+ic("down")+'</button>'+
      '</div>'+
      '<div class="rrow">'+
        '<button class="rk" data-key="KEY_RETURN">'+ic("back")+'Retour</button>'+
        '<button class="rk" data-key="KEY_HOME">'+ic("home")+'Accueil</button>'+
      '</div>'+
      '<div class="rrow">'+
        '<button class="rk" data-key="KEY_VOLDOWN">'+ic("voldn")+'Vol −</button>'+
        '<button class="rk" data-key="KEY_MUTE">'+ic("mute")+'Muet</button>'+
        '<button class="rk" data-key="KEY_VOLUP">'+ic("volup")+'Vol +</button>'+
      '</div>'+
    '</div>';
    h+='<div class="hint" style="text-align:center;margin:-2px 0 10px">Éteindre : appui court = Art Mode · appui long = extinction</div>';
    h+='<div class="apps">'+
      '<button class="appbtn free" data-launch="b2" aria-label="TV by Free"><img class="applogo" src="tvbyfree.png" alt="" onerror="this.parentNode.classList.add(\'nologo\');this.remove()">'+ic("play")+'<span class="aname">TV by Free</span></button>'+
    '</div>';
    return h;
  }

  function settingsView(){
    var h='<div class="card"><div class="lbl">Ma TV Samsung</div>'+
      '<div class="field"><label>Adresse IP de la TV</label><input id="f-ip" type="text" inputmode="decimal" placeholder="ex. 192.168.1.30" value="'+esc(state.ip)+'"></div>'+
      '<div class="field"><label>Adresse MAC (pour l\'allumage)</label><input id="f-mac" type="text" placeholder="ex. A1:B2:C3:D4:E5:F6" value="'+esc(state.mac)+'"></div>'+
      '<button class="wbtn" data-connect>'+(state.token?"Reconnecter / ré-appairer":"Appairer la TV")+'</button>'+
      '<div class="hint">'+(state.tvName?("Connectée à <b>"+esc(unent(state.tvName))+"</b>. "):"")+'Active « Mise sous tension à distance » (ou Wake-on-LAN) dans les réglages réseau de la TV pour l\'allumage.</div></div>';
    // raccourcis d'apps
    h+='<div class="card"><div class="lbl">Boutons d\'applications</div>';
    h+='<div class="field"><label>Bouton « TV by Free » · ID d\'application</label><input id="f-b2" type="text" placeholder="ex. 3201xxxxxxxxx" value="'+esc(state.b2.appId)+'"></div>';
    h+='<button class="wbtn sec" data-detect>Détecter les applis installées</button>';
    h+='<div class="field-note hint" style="margin:10px 0 6px"><b>Sans ID ?</b> Enregistre le parcours dans le menu de la TV : l\'appli le rejouera quand tu toucheras le bouton'+(state.macro.length?' (<b>'+state.macro.length+' étapes</b> enregistrées).':'.')+'</div>'+
      '<button class="wbtn sec" data-recstart>'+(state.macro.length?'Réenregistrer le parcours':'Enregistrer le parcours')+'</button>'+
      (state.macro.length?'<button class="wbtn sec" data-macroplay>Tester le parcours</button><button class="wbtn sec" data-macroclear>Effacer le parcours</button>':'');
    if(state.detectStatus&&!state.apps.length)h+='<div class="hint">Ta TV ne répond pas à la demande de liste (« '+esc(state.detectStatus)+' »). Ça arrive sur certains modèles. Dans ce cas, colle l\'ID à la main ou enregistre un parcours (ci-dessus).</div>';
    if(state.apps.length){
      h+='<div class="hint">Touche « Associer » en face de l\'appli TV by Free pour remplir l\'ID automatiquement.</div><div class="applist">';
      var q=norm(state.appq||""),FR=/free|oqee|qqee/i,L=state.apps.filter(function(a){return !q||norm((a.name||"")+" "+a.appId).indexOf(q)>=0}).sort(function(x,y){return (FR.test(y.name||"")-FR.test(x.name||""))||String(x.name||"").localeCompare(String(y.name||""))});
      h+='<div class="field"><label>Filtrer les '+state.apps.length+' applis</label><input id="f-appq" type="text" placeholder="ex. free" value="'+esc(state.appq||"")+'"></div>';
      L.forEach(function(a){
        h+='<div class="approw"><div style="min-width:0"><div class="nm">'+esc(a.name||a.appId)+'</div><div class="id">'+esc(a.appId)+'</div></div>'+
          '<div class="pick"><button data-assign="b2" data-appid="'+esc(a.appId)+'">Associer</button></div></div>';
      });
      if(!L.length)h+='<div class="hint">Aucune appli ne correspond.</div>';
      h+='</div>';
    }
    h+='</div>';
    h+='<div class="card"><div class="lbl">Partager la configuration</div>'+
      '<div class="hint">Envoie tes réglages (IP, MAC, bouton TV by Free'+(state.token?', appairage':'')+') à un autre appareil qui vient d\'installer l\'appli : il n\'aura rien à retaper.</div>'+
      '<button class="wbtn" data-cfgshare style="margin-top:10px">Envoyer ma configuration</button>'+
      '<button class="wbtn sec" data-cfgcopy>Copier le code</button>'+
      '<div class="hint" style="margin-top:6px">Sur l\'autre appareil, colle le code ici :</div>'+
      '<textarea id="f-cfg" class="cfgta" placeholder="TCS1:…" spellcheck="false" autocapitalize="off"></textarea>'+
      '<button class="wbtn sec" data-cfgimport>Importer la configuration</button>'+
      (state.token?'<div class="hint">Le code contient l\'autorisation d\'appairage de ta TV : ne le partage qu\'avec tes propres appareils.</div>':'')+'</div>';
    // application / mise à jour
    h+='<div class="card"><div class="lbl">Application</div>'+
      '<div class="hint">Version : '+(devBuild()?"préversion (dev)":esc(APP_VERSION))+(appUpd.avail?" · <b>mise à jour disponible</b>":"")+'</div>'+
      '<button class="wbtn sec" data-checkupd'+(appUpd.checking?" disabled":"")+' style="margin-top:10px">'+(appUpd.checking?"Recherche…":"Rechercher une mise à jour")+'</button>'+
      (appUpd.avail?'<button class="wbtn" data-getapk>Télécharger la mise à jour</button>':'')+'</div>';
    h+='<button class="wbtn sec" data-view="remote">← Retour à la télécommande</button>';
    return h;
  }

  function render(){
    var h='<header><div class="brand">'+
      '<svg class="mk" viewBox="0 0 32 32" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="14" height="26" rx="5"/><circle cx="16" cy="10" r="2.3" fill="var(--accent)" stroke="none"/><path d="M13 18h6M16 22v3"/></svg>'+
      '<div style="min-width:0"><h1>TV Chap <b>Simple</b></h1><div class="status'+(state.token?" ok":"")+'">'+(state.ip?(state.token?("● "+esc(unent(state.tvName)||state.ip)):("○ "+esc(state.ip)+" · non appairée")):"Non configurée")+'</div></div></div>'+
      '<button class="gear" data-view="'+(state.view==="settings"?"remote":"settings")+'" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.2A1.6 1.6 0 0 0 7 19.3a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 2.7 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.2A1.6 1.6 0 0 0 17 2.7a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg></button></header>';
    h+=(state.view==="settings"?settingsView():remoteView());
    document.getElementById("app").innerHTML=h;
  }

  document.addEventListener("click",function(ev){
    var t=ev.target.closest("[data-view],[data-key],[data-launch],[data-wol],[data-art],[data-connect],[data-detect],[data-assign],[data-checkupd],[data-getapk],[data-cfgshare],[data-cfgcopy],[data-cfgimport],[data-recstart],[data-recok],[data-reccancel],[data-macroplay],[data-macroclear]");
    if(!t)return;var d=t.dataset;
    if(d.view){ if(state.view==="settings")syncFields(); state.view=d.view;render();window.scrollTo(0,0);return;}
    if(d.key){key(d.key);return;}
    if(d.launch){launch(state[d.launch].appId);return;}
    if(t.hasAttribute("data-wol")){wol();return;}
    if(t.hasAttribute("data-art")){if(hold.done){hold.done=false;return;}artMode();return;}
    if(t.hasAttribute("data-connect")){syncFields();connect();return;}
    if(t.hasAttribute("data-detect")){syncFields();detect();return;}
    if(d.assign){state.b2.appId=d.appid;save();toast("Associé au bouton TV by Free");render();return;}
    if(t.hasAttribute("data-recstart")){syncFields();startRec();return;}
    if(t.hasAttribute("data-recok")){stopRec(true);return;}
    if(t.hasAttribute("data-reccancel")){stopRec(false);return;}
    if(t.hasAttribute("data-macroplay")){playMacro();return;}
    if(t.hasAttribute("data-macroclear")){state.macro=[];save();toast("Parcours effacé.");render();return;}
    if(t.hasAttribute("data-cfgshare")){syncFields();cfgShare();return;}
    if(t.hasAttribute("data-cfgcopy")){syncFields();cfgCopy();return;}
    if(t.hasAttribute("data-cfgimport")){cfgImport();return;}
    if(t.hasAttribute("data-checkupd")){checkUpdate(true);return;}
    if(t.hasAttribute("data-getapk")){getApk();return;}
  });
  // --- partage de la configuration : un code texte « TCS1:… » (JSON en base64) ---
  function utf8b64(t){return btoa(unescape(encodeURIComponent(t)));}
  function b64utf8(b){return decodeURIComponent(escape(atob(b)));}
  function cfgCode(){return "TCS1:"+utf8b64(JSON.stringify({ip:state.ip,mac:state.mac,token:state.token||"",tvName:state.tvName||"",app:state.b2.appId||"",macro:state.macro||[]}));}
  function cfgMessage(){return "Ma configuration TV Chap Simple (colle ce code dans Réglages › Partager la configuration › Importer) :\n"+cfgCode();}
  function copyText(t){
    function fallback(){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}a.remove();toast(ok?"Code copié.":"Copie impossible : sélectionne le code à la main.");}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Code copié.");},fallback);else fallback();
  }
  function cfgCopy(){if(!state.ip&&!state.mac&&!state.b2.appId&&!state.macro.length){toast("Rien à partager pour l'instant.");return;}copyText(cfgCode());}
  function cfgShare(){
    if(!state.ip&&!state.mac&&!state.b2.appId&&!state.macro.length){toast("Rien à partager pour l'instant.");return;}
    if(navigator.share){navigator.share({title:"TV Chap Simple",text:cfgMessage()}).catch(function(e){if(e&&e.name!=="AbortError")copyText(cfgCode());});}
    else copyText(cfgCode());
  }
  function cfgImport(){
    var el=document.getElementById("f-cfg"),v=el?el.value:"",m=/TCS1:([A-Za-z0-9+\/=]+)/.exec(v);
    if(!m){toast("Code non reconnu : colle le code complet (il commence par TCS1:).");return;}
    var c;try{c=JSON.parse(b64utf8(m[1]));}catch(e){toast("Code illisible ou incomplet.");return;}
    if(!c||typeof c!=="object"){toast("Code illisible.");return;}
    if(typeof c.ip==="string")state.ip=c.ip.trim();
    if(typeof c.mac==="string")state.mac=c.mac.trim();
    if(typeof c.token==="string")state.token=c.token;
    if(typeof c.tvName==="string")state.tvName=c.tvName;
    if(typeof c.app==="string")state.b2.appId=c.app.trim();
    if(Array.isArray(c.macro))state.macro=c.macro.filter(function(m){return m&&MK[m.k];}).map(function(m){return {k:m.k,d:Math.max(300,Math.min(3000,+m.d||800))};}).slice(0,60);
    save();toast("Configuration importée"+(state.token?".":" : il reste à appairer la TV."));render();
  }
  function syncFields(){
    var ip=document.getElementById("f-ip"),mac=document.getElementById("f-mac"),b2=document.getElementById("f-b2");
    if(ip)state.ip=ip.value.trim();
    if(mac)state.mac=mac.value.trim();
    if(b2)state.b2.appId=b2.value.trim();
    save();
  }
  render();
  if(NATIVE_APP)setTimeout(function(){checkUpdate(false);},4000);
})();
</script>
</body>
</html>
