name: Build Zapette APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm ci

      - name: Inject build id
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/@@BUILD@@/$SHA/g" www/index.html
          echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Build id: $SHA"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PverCode=${{ github.run_number }} \
            -PverName=$(git rev-parse --short HEAD)

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Zapette.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapette-APK
          path: Zapette.apk
          if-no-files-found: error

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zapette — dernier build
          body: "Télécommande universelle Samsung (prototype). Installez en autorisant les sources inconnues. build:${{ env.BUILD_SHA }}"
          prerelease: true
          files: Zapette.apk
